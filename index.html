<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
    <meta name="theme-color" content="#4ade80">
    <title>MeloFocus</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <script src="theme.js"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Floating Background -->
    <div class="background">
        <div class="blob blob1"></div>
        <div class="blob blob2"></div>
        <div class="blob blob3"></div>
    </div>

    <!-- Header -->

    <header>

        <h1>MeloFocus 🌸</h1>

        <div id="currentTime">
            00:00:00
        </div>

        <div class="appearance-controls">
        <div class="theme-switch" role="group" aria-label="Appearance">
            <button type="button" data-theme-choice="basic" aria-pressed="true">☀ Basic</button>
            <button type="button" data-theme-choice="dark" aria-pressed="false">☾ Dark</button>
            <button type="button" data-theme-choice="custom" aria-pressed="false">✧ Custom</button>
        </div>
        <label id="customBackgroundPicker" class="scenery-select" hidden>
            <span>Scenery</span>
            <select id="backgroundChoices" aria-label="Choose scenery"></select>
        </label>
        </div>
    </header>


<main>

        <!-- ===================== -->
        <!-- LEFT PANEL -->
        <!-- ===================== -->

        <aside class="left-panel">

            <h2>Tasks</h2>

            <input
                type="text"
                id="taskInput"
                placeholder="Enter Task">

            <input
                type="number"
                id="rewardInput"
                placeholder="Reward Minutes">

            <div class="task-buttons">

                <button id="addTaskBtn">
                    Add Task
                </button>

                <button id="deleteTaskBtn">
                    Delete
                </button>

            </div>

            <ul id="taskList">

            </ul>

        </aside>



        <!-- ===================== -->
        <!-- TIMER -->
        <!-- ===================== -->

        <section class="timer-panel">
            <div class="mode-switch" role="group" aria-label="Timer mode">
                <button id="focusModeBtn" type="button" aria-pressed="true">Focus</button>
                <button id="breakModeBtn" type="button" aria-pressed="false">Break</button>
            </div>

            <h2 id="modeLabel">
                FOCUS MODE
            </h2>


            <div class="timer-circle">

                <svg width="260" height="260">

                    <circle
                        cx="130"
                        cy="130"
                        r="110"
                        class="bg-circle">
                    </circle>

                    <circle
                        cx="130"
                        cy="130"
                        r="110"
                        class="progress-circle"
                        id="progressCircle">
                    </circle>

                </svg>

                <input class="timer-text" id="timer" type="text" inputmode="numeric" value="25:00" aria-label="Timer duration in minutes. Select Focus or Break, then edit here." autocomplete="off" spellcheck="false">

            </div>



            <div class="timer-buttons">

                <button id="startBtn">
                    ▶ Start
                </button>

                <button id="pauseBtn">
                    ⏸ Pause
                </button>

                <button id="resetBtn">
                    ↺ Reset
                </button>

            </div>



            <p class="timer-edit-hint" id="timerEditHint">Tap the time to set minutes</p>
            <input type="hidden" id="focusMinutes" value="25">
            <input type="hidden" id="breakMinutes" value="5">

        </section>

        <section class="progress-panel" aria-label="Session and break bank">
            <div class="stats">

                <div class="card">

                    <h3>

                        Session

                    </h3>

                    <p id="sessionCount">

                        #1

                    </p>

                </div>


                <div class="card">

                    <h3>

                        Break Bank

                    </h3>

                    <p id="breakBank">

                        0 min

                    </p>

                </div>

            </div>


            <button
                id="redeemBtn"
                class="redeem">

                🏦 Redeem Break

            </button>
            <button id="resetBankBtn" type="button" class="reset-bank">↺ Reset Break Bank</button>

        </section>

    </main>



    <!-- ========================== -->
    <!-- BREAK POPUP -->
    <!-- ========================== -->

    <div
        id="popupOverlay"
        class="hidden">

        <div class="popup">

            <h2>

                🌸 Session Complete

            </h2>

            <p>

                Would you like to take a break?

                <span id="breakDecisionCountdown" style="display: block; font-size: 0.85em; margin-top: 8px;">Focus starts automatically in 20 seconds.</span>

            </p>

            <div class="popup-buttons">

                <button
                    id="takeBreak">

                    Yes

                </button>

                <button
                    id="skipBreak">

                    Skip & Earn

                </button>

            </div>

        </div>

    </div>



    <!-- ========================== -->
    <!-- REDEEM POPUP -->
    <!-- ========================== -->

    <div
        id="redeemOverlay"
        class="hidden">

        <div class="popup">

            <h2>

                Redeem Break 🌸

            </h2>

            <p>

                How many minutes?

            </p>

            <input
                type="number"
                id="redeemMinutes"
                value="5"
                min="1">

            <div class="popup-buttons">

                <button
                    id="confirmRedeem">

                    Start Break

                </button>

                <button
                    id="cancelRedeem">

                    Cancel

                </button>

            </div>

        </div>

    </div>



    <!-- ========================== -->
    <!-- FOOTER -->
    <!-- ========================== -->

    <footer>

         🌸Shira-yuki23(Musfirat)🌸

    </footer>


    <script src="script.js"></script>

</body>

</html>
